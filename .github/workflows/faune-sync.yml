# Catalogue agrégé des espèces animales d'Algérie depuis GBIF.
name: Synchro faune algérienne

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 1,15 * *"
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : télécharger et calculer, sans publier"
        type: boolean
        default: true
      forcer:
        description: "Forcer : ignorer l'échéance"
        type: boolean
        default: false

concurrency:
  group: faune-algerie-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  controle-branche:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Vérifier les types TypeScript
        run: npm run typecheck
      - name: Tester l'API
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier le code Python
        run: |
          python -m py_compile scripts/faune/calculer.py
          python -m unittest discover -s scripts/faune/tests -p "test_*.py" -v
      - name: Valider le workflow
        run: |
          python -m pip install --disable-pip-version-check actionlint-py
          actionlint .github/workflows/faune-sync.yml

  synchro:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_URL: ${{ secrets.API_URL }}
      CLE_SYNCHRO: ${{ secrets.CLE_SYNCHRO }}
      GBIF_USERNAME: ${{ secrets.GBIF_USERNAME }}
      GBIF_PASSWORD: ${{ secrets.GBIF_PASSWORD }}
      GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
      SYNCHRO_ESSAI: ${{ github.event_name == 'workflow_dispatch' && inputs.essai || false }}
      SYNCHRO_FORCER: ${{ github.event_name == 'workflow_dispatch' && inputs.forcer || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Début de l'exécution
        run: echo "SYNCHRO_DEBUT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Vérifier l'échéance
        id: echeance
        run: npx tsx scripts/faune/publier.ts --verifier
      - name: Vérifier les identifiants GBIF
        if: steps.echeance.outputs.a_faire == 'true'
        run: |
          test -n "$GBIF_USERNAME" || (echo "::error::Secret GBIF_USERNAME manquant" && exit 1)
          test -n "$GBIF_PASSWORD" || (echo "::error::Secret GBIF_PASSWORD manquant" && exit 1)
          test -n "$GBIF_EMAIL" || (echo "::error::Secret GBIF_EMAIL manquant" && exit 1)
      - name: Télécharger et agréger les occurrences GBIF
        id: calcul
        if: steps.echeance.outputs.a_faire == 'true'
        run: |
          python scripts/faune/calculer.py \
            --cache "$RUNNER_TEMP/faune/cache" \
            --sortie "$RUNNER_TEMP/faune/sortie" \
            --attente-max-secondes 5400
      - name: Publier le catalogue et rapporter
        if: steps.echeance.outputs.a_faire == 'true'
        run: npx tsx scripts/faune/publier.ts --sortie "$RUNNER_TEMP/faune/sortie"
      - name: Conserver les agrégats calculés
        if: always() && steps.calcul.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: faune-algerie-gbif-sortie
          path: ${{ runner.temp }}/faune/sortie/
          if-no-files-found: error
          retention-days: 14
      - name: Rapporter l'échec
        if: failure() && steps.echeance.outputs.a_faire == 'true'
        run: npx tsx scripts/faune/publier.ts --echec "Échec du téléchargement GBIF ou de la publication du catalogue faune (voir les journaux)."
