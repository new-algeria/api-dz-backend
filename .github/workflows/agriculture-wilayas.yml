name: Vérifier extraction agriculture par wilaya

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install -r scripts/agriculture/requirements-wilayas.txt
      - name: Tester les contrôles et le schéma
        working-directory: scripts/agriculture
        run: python -m unittest -v test_calculer_wilayas.py
