name: Tests prix alimentaires

on:
  pull_request:
    paths:
      - "scripts/prix-alimentaires/**"
      - ".github/workflows/prix-alimentaires-*.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Vérifier les types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Essai réel de la source publique (sans publication)
        run: npx tsx scripts/prix-alimentaires/collecter.ts --sortie "$RUNNER_TEMP/prix-alimentaires"
