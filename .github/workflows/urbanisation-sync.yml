# Synchronisation « Étalement urbain : surface bâtie par wilaya » → data-dz (scripts/urbanisation).
# Passe chaque mois, mais ne travaille qu'à l'échéance réglée dans l'administration du site (/admin/sync, ligne
# « urbanisation » : 365 jours par défaut). Un passage télécharge les tuiles GHS-BUILT-S R2023A du JRC qui couvrent
# l'Algérie (environ 600 Mo pour les 12 époques), additionne les surfaces bâties par wilaya, publie une nouvelle version
# seulement si les chiffres ont changé et dépose son rapport (visible dans /admin/sync).
#
# Secrets du dépôt : API_URL (https://api.data-dz.com), CLE_SYNCHRO (même valeur que dans Vercel).
name: Synchro urbanisation

on:
  schedule:
    - cron: "19 5 7 * *"
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : tout calculer et rapporter, ne rien publier"
        type: boolean
        default: true
      forcer:
        description: "Forcer : ignorer l'échéance"
        type: boolean
        default: false

concurrency:
  group: urbanisation-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  synchro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_URL: ${{ secrets.API_URL }}
      CLE_SYNCHRO: ${{ secrets.CLE_SYNCHRO }}
      # Champs du lancement manuel, passés en variables (jamais injectés dans la commande).
      SYNCHRO_ESSAI: ${{ inputs.essai }}
      SYNCHRO_FORCER: ${{ inputs.forcer }}
      # Dossiers de travail : sous $RUNNER_TEMP, lu dans les commandes (le contexte `runner` n'existe pas au niveau du job).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Début de l'exécution
        run: echo "SYNCHRO_DEBUT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Échéance
        id: echeance
        run: npx tsx scripts/urbanisation/publier.ts --verifier

      - uses: actions/setup-python@v5
        if: steps.echeance.outputs.a_faire == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/urbanisation/requirements.txt

      - name: Calculer
        id: calcul
        if: steps.echeance.outputs.a_faire == 'true'
        run: |
          pip install -q -r scripts/urbanisation/requirements.txt
          python -m unittest discover -s scripts/urbanisation
          python scripts/urbanisation/calculer.py --cache "$RUNNER_TEMP/urbanisation/cache" --sortie "$RUNNER_TEMP/urbanisation/sortie"

      - name: Publier et rapporter
        if: steps.echeance.outputs.a_faire == 'true'
        run: npx tsx scripts/urbanisation/publier.ts --sortie "$RUNNER_TEMP/urbanisation/sortie"

      - name: Conserver les fichiers calculés
        if: always() && steps.calcul.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: surface-batie-wilayas-sortie
          path: ${{ runner.temp }}/urbanisation/sortie/
          if-no-files-found: error
          retention-days: 14

      - name: Rapporter l'échec
        if: failure() && steps.echeance.outputs.a_faire == 'true'
        run: npx tsx scripts/urbanisation/publier.ts --echec "Échec de la GitHub Action (étape « ${{ steps.calcul.outcome == 'failure' && 'Calculer' || 'Publier' }} »), voir ses journaux."
