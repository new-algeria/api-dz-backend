# Synchronisation de la production de la pêche et de l'aquaculture de l'Algérie depuis la FAO (FishStat, fichier groupé Global production).
# Le fichier de la FAO est public et sans clé ; seules les clés API_URL et CLE_SYNCHRO servent à la publication. L'échéance (30 jours) est en base.
name: Synchro peche-aquaculture

on:
  push:
    branches: [relecture/peche-aquaculture]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 4"
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : calculer et rapporter, ne rien publier"
        type: boolean
        default: true
      forcer:
        description: "Forcer : ignorer l'échéance"
        type: boolean
        default: false

concurrency:
  group: peche-aquaculture-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  controle-branche:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_URL: ${{ secrets.API_URL }}
      SYNCHRO_ESSAI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Vérifier les types
        run: npm run typecheck

      - name: Tester
        run: npm test

      - name: Valider le workflow
        run: |
          python -m pip install --disable-pip-version-check actionlint-py
          actionlint .github/workflows/peche-aquaculture-sync.yml

      - name: Calculer la pêche et l'aquaculture en essai
        id: calcul
        run: |
          npx tsx scripts/peche-aquaculture/calculer.ts \
            --cache "$RUNNER_TEMP/peche-aquaculture/cache" \
            --sortie "$RUNNER_TEMP/peche-aquaculture/sortie"

      - name: Vérifier la publication sans écrire
        run: npx tsx scripts/peche-aquaculture/publier.ts --essai --sortie "$RUNNER_TEMP/peche-aquaculture/sortie"

      - name: Conserver les fichiers calculés
        if: always() && steps.calcul.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: peche-aquaculture-algerie-sortie
          path: ${{ runner.temp }}/peche-aquaculture/sortie/
          if-no-files-found: error
          retention-days: 14

  synchro:
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_URL: ${{ secrets.API_URL }}
      CLE_SYNCHRO: ${{ secrets.CLE_SYNCHRO }}
      SYNCHRO_ESSAI: ${{ inputs.essai }}
      SYNCHRO_FORCER: ${{ inputs.forcer }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Début de l'exécution
        run: echo "SYNCHRO_DEBUT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Échéance
        id: echeance
        run: npx tsx scripts/peche-aquaculture/publier.ts --verifier

      - name: Calculer la pêche et l'aquaculture
        id: calcul
        if: steps.echeance.outputs.a_faire == 'true'
        run: |
          npx tsx scripts/peche-aquaculture/calculer.ts \
            --cache "$RUNNER_TEMP/peche-aquaculture/cache" \
            --sortie "$RUNNER_TEMP/peche-aquaculture/sortie"

      - name: Publier et rapporter
        if: steps.echeance.outputs.a_faire == 'true'
        run: npx tsx scripts/peche-aquaculture/publier.ts --sortie "$RUNNER_TEMP/peche-aquaculture/sortie"

      - name: Conserver les fichiers calculés
        if: always() && steps.calcul.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: peche-aquaculture-algerie-sortie
          path: ${{ runner.temp }}/peche-aquaculture/sortie/
          if-no-files-found: error
          retention-days: 14

      - name: Rapporter l'échec
        if: failure() && steps.echeance.outputs.a_faire == 'true'
        run: npx tsx scripts/peche-aquaculture/publier.ts --echec "Échec de la GitHub Action (calcul ou publication), voir les journaux."
