# Synchronisation du commerce extérieur de l'Algérie depuis BACI (CEPII). L'archive HS92 fait environ 2,4 Go :
# elle n'est téléchargée que si le CEPII a publié une nouvelle version (étape Échéance). Clés API_URL et CLE_SYNCHRO.
name: Synchro commerce-exterieur

on:
  push:
    branches: [relecture/commerce-exterieur]
  # Seulement les PR qui touchent ce robot : le contrôle télécharge l'archive BACI (2,4 Go).
  pull_request:
    branches: [main]
    paths:
      - "scripts/commerce-exterieur/**"
      - "test/commerce-exterieur.test.ts"
      - ".github/workflows/commerce-exterieur-sync.yml"
  schedule:
    - cron: "29 2 * * 0"
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : calculer et rapporter, ne rien publier"
        type: boolean
        default: true
      forcer:
        description: "Forcer : ignorer l'échéance"
        type: boolean
        default: false

concurrency:
  group: commerce-exterieur-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  controle-branche:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_URL: ${{ secrets.API_URL }}
      SYNCHRO_ESSAI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Vérifier les types
        run: npm run typecheck

      - name: Tester
        run: npm test

      - name: Valider le workflow
        run: |
          python -m pip install --disable-pip-version-check actionlint-py
          actionlint .github/workflows/commerce-exterieur-sync.yml

      - name: Calculer le commerce extérieur en essai
        id: calcul
        run: |
          npx tsx scripts/commerce-exterieur/calculer.ts \
            --cache "$RUNNER_TEMP/commerce-exterieur/cache" \
            --sortie "$RUNNER_TEMP/commerce-exterieur/sortie"

      - name: Vérifier la publication sans écrire
        run: npx tsx scripts/commerce-exterieur/publier.ts --essai --sortie "$RUNNER_TEMP/commerce-exterieur/sortie"

      - name: Conserver les fichiers calculés
        if: always() && steps.calcul.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: commerce-exterieur-algerie-sortie
          path: ${{ runner.temp }}/commerce-exterieur/sortie/
          if-no-files-found: error
          retention-days: 14

  synchro:
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_URL: ${{ secrets.API_URL }}
      CLE_SYNCHRO: ${{ secrets.CLE_SYNCHRO }}
      SYNCHRO_ESSAI: ${{ inputs.essai }}
      SYNCHRO_FORCER: ${{ inputs.forcer }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Début de l'exécution
        run: echo "SYNCHRO_DEBUT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Échéance
        id: echeance
        run: npx tsx scripts/commerce-exterieur/publier.ts --verifier

      - name: Calculer le commerce extérieur
        id: calcul
        if: steps.echeance.outputs.a_faire == 'true'
        run: |
          npx tsx scripts/commerce-exterieur/calculer.ts \
            --cache "$RUNNER_TEMP/commerce-exterieur/cache" \
            --sortie "$RUNNER_TEMP/commerce-exterieur/sortie"

      - name: Publier et rapporter
        if: steps.echeance.outputs.a_faire == 'true'
        run: npx tsx scripts/commerce-exterieur/publier.ts --sortie "$RUNNER_TEMP/commerce-exterieur/sortie"

      - name: Conserver les fichiers calculés
        if: always() && steps.calcul.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: commerce-exterieur-algerie-sortie
          path: ${{ runner.temp }}/commerce-exterieur/sortie/
          if-no-files-found: error
          retention-days: 14

      - name: Rapporter l'échec
        if: failure() && steps.echeance.outputs.a_faire == 'true'
        run: npx tsx scripts/commerce-exterieur/publier.ts --echec "Échec de la GitHub Action (calcul ou publication), voir les journaux."
